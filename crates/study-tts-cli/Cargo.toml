[package]
name = "study-tts-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

# `study-tts` rather than the package name: the command an author types is the
# published surface, and `DELIVERY-PLAN.md` E1-S5 names it that way.
[[bin]]
name = "study-tts"
path = "src/main.rs"

[lints]
workspace = true

# Candidates in ADR-0001 §7.2 are declared when the story that needs
# them lands, not in advance: an unused dependency is still audited,
# licensed, and carried in Cargo.lock.
#
# E1-S5 is that story for `clap`, which ADR-0001 §7.2 names for "stable
# subcommands and non-interactive use". The two workspace crates carry every
# other decision: this binary parses arguments, calls two functions, and
# formats refusals.
[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
study-tts-core = { version = "0.1.0", path = "../study-tts-core" }
study-tts-runtime = { version = "0.1.0", path = "../study-tts-runtime" }

[dev-dependencies]
study-tts-testkit = { version = "0.1.0", path = "../study-tts-testkit" }
tempfile = "3.27.0"
