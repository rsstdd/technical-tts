[package]
name = "study-tts-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Candidates in ADR-0001 §7.2 are declared when the story that needs
# them lands, not in advance: an unused dependency is still audited,
# licensed, and carried in Cargo.lock.
[dependencies]
blake3 = "1.8.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
