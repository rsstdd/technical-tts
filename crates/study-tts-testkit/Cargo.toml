[package]
name = "study-tts-testkit"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Candidates in ADR-0001 §7.2 are declared when the story that needs
# them lands, not in advance: an unused dependency is still audited,
# licensed, and carried in Cargo.lock.
[dependencies]
blake3 = "1.8.6"
hound = "3.5.1"
# Not an ADR-0001 §7.2 candidate, and admitted under §7.2's own test — a
# crate is added when it removes more risk than it introduces. `pattern`
# in JSON Schema 2020-12 is an ECMA-262 regular expression, and a
# hand-rolled engine that quietly accepts what it did not understand
# agrees with every pattern including a wrong one. Four transitive crates,
# no network, and this crate never reaches a production path.
regex = "1.13.1"
# `regex`'s own parser, already in the tree beneath it, so naming it directly
# adds no crate. It answers whether a pattern is anchored on every alternation
# branch, which reading the first and last character cannot: `^a|b$` begins and
# ends with the two anchors and constrains neither side, and `^price\$` ends
# with an escaped literal rather than an anchor. Both would have passed a
# textual check as fully anchored.
regex-syntax = "0.8.11"
serde_json = "1.0.151"
sha2 = "0.10.9"
study-tts-core = { version = "0.1.0", path = "../study-tts-core" }
study-tts-runtime = { version = "0.1.0", path = "../study-tts-runtime" }
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
