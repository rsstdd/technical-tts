[package]
name = "study-tts-runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.6"
fs2 = "0.4.3"
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
study-tts-core = { version = "0.1.0", path = "../study-tts-core" }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "fs",
    "io-util",
    "time",
] }
tracing = "0.1.44"
