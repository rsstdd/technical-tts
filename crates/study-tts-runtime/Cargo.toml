[package]
name = "study-tts-runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Candidates in ADR-0001 §7.2 are declared when the story that needs
# them lands, not in advance: an unused dependency is still audited,
# licensed, and carried in Cargo.lock.
[dependencies]
blake3 = "1.8.6"
# The governed model acquisition record states SHA-256, so the gate that
# proves the weights verifies what that record actually says rather than
# re-hashing a ratified artifact into this crate's preferred algorithm.
# Already in the workspace beneath `study-tts-testkit`, so no new crate
# enters `Cargo.lock`.
sha2 = "0.10.9"
hound = "3.5.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
study-tts-core = { version = "0.1.0", path = "../study-tts-core" }
tempfile = "3.27.0"
thiserror = "2.0.20"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }
