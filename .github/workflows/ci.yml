name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  walking-skeleton:
    name: walking-skeleton
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Place rust-cache immediately after toolchain setup
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Updated APT command with quiet/noninteractive flags
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg

      - name: Restore locked Rust dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint offline
        run: cargo clippy --offline --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace tests offline
        run: cargo test --offline --workspace --all-targets --locked

      - name: t4_e0_skeleton_runs_offline_without_model_artifacts
        run: |
          sudo unshare --net -- env \
            "HOME=$HOME" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "PATH=$PATH" \
            bash -euo pipefail -c '
              test "$(ip -o link show | wc -l)" -eq 1
              ip link set dev lo up
              timeout --signal=TERM 60s cargo test --offline --workspace --all-targets --locked
            '
