# Fast pull-request checks.
#
# Everything here runs on an ordinary hosted runner, needs no model weights, no
# voice references, and no reference machine, and is expected to finish in
# minutes. That boundary is the point: ADR-0001 §14 and §17 separate what every
# pull request must pass from what only the qualified reference machine can
# answer, and the second half lives in `qualification.yml` so it can never
# quietly become a prerequisite for merging a documentation fix.
#
# `t4_e1_pr_suite_performs_no_model_download` is this file's counterpart in the
# test suite: it proves the render path wants no model, while the network
# namespace below proves the run could not have fetched one anyway.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Must match rust-toolchain.toml, which governs every cargo invocation.
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Restore locked Rust dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust conventions
        # rustfmt does not apply max_width to comment text, wrap_comments is
        # nightly-only, and it preserves doc/attribute order, so the AGENTS.md
        # line, comment, and doc-order rules need their own check.
        run: python3 scripts/check-rust-conventions.py

      - name: Check evidence provenance
        # Accepted records under `evidence/` pin the SHA-256 of every document
        # their conclusion rests on. `AGENTS.md` stated as prose that editing
        # such a document obliges recomputing them, and prose drifted twice
        # before anything reported it — once inside a commit whose own purpose
        # was correcting provenance. `evidence/README.md` §Provenance is the
        # policy this step enforces.
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_check_evidence_provenance.py'
          python3 scripts/check-evidence-provenance.py

      - name: Check Cargo.toml formatting
        run: |
          curl -fsSL -o "$RUNNER_TEMP/taplo.gz" \
            https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz
          echo "8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156  $RUNNER_TEMP/taplo.gz" \
            | sha256sum -c -
          gunzip "$RUNNER_TEMP/taplo.gz"
          chmod +x "$RUNNER_TEMP/taplo"
          "$RUNNER_TEMP/taplo" fmt --check

      - name: Lint offline
        run: cargo clippy --offline --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check the worker package compiles
        # The worker is a declared input to the bundle hash, so a syntax error
        # in it would change that hash and still ship. `PYTHONPYCACHEPREFIX`
        # keeps the bytecode out of `worker/`: an undeclared `__pycache__`
        # beside a declared input does not change the hash
        # (`t1_e1_worker_bundle_hash_ignores_unrelated_repository_files`), but
        # it is still a file a reader has to decide to ignore.
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python3 -m compileall -q -f worker/study_tts_worker

      - name: Check the worker protocol boundary
        # `worker/tests/` is outside the declared bundle and uses only the
        # standard library, so proving the frame reader refuses what it must
        # neither changes the bundle hash nor adds a locked dependency.
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python3 -m unittest discover --start-directory worker/tests

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg

      - name: Restore locked Rust dependencies
        run: cargo fetch --locked

      - name: Build workspace test binaries offline
        run: |
          cargo test --offline --workspace --all-targets --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' \
            | sort -u > "$RUNNER_TEMP/study-tts-test-binaries"
          test -s "$RUNNER_TEMP/study-tts-test-binaries"

      - name: Run T4 suite without runtime egress
        run: |
          sudo unshare --net -- env \
            "RUNNER_USER=$(id -un)" \
            "HOME=$HOME" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "PATH=$PATH" \
            "TEST_BINARIES=$RUNNER_TEMP/study-tts-test-binaries" \
            bash -euo pipefail -c '
              test "$(ip -o link show | wc -l)" -eq 1
              ip link set dev lo up
              exec runuser -u "$RUNNER_USER" -- env \
                "HOME=$HOME" \
                "CARGO_HOME=$CARGO_HOME" \
                "RUSTUP_HOME=$RUSTUP_HOME" \
                "PATH=$PATH" \
                "TEST_BINARIES=$TEST_BINARIES" \
                timeout --signal=TERM 120s \
                bash -euo pipefail -c '\''
                  while IFS= read -r test_binary; do
                    "$test_binary"
                  done < "$TEST_BINARIES"
                '\''
            '

      - name: Run doc tests offline
        run: cargo test --offline --workspace --doc --locked

      - name: Check the checked-in schemas are current
        # Regeneration must be a no-op on a clean tree.
        # `t3_e1_generated_schemas_match_checked_in_files` already asserts this,
        # and this step makes the failure legible: it shows the diff rather than
        # a byte-comparison assertion message.
        run: |
          cargo run --offline --locked --package study-tts-runtime --example generate-schemas
          git diff --exit-code -- schemas/

  dependency-policy:
    name: dependency-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.97.1"
