# Generated by the procedure in `docs/operations/WORKER-ENVIRONMENT.md` from the
# reference machine qualified in ADR-0002: WSL2, Ubuntu 24.04, CPython 3.12.3,
# x86_64. Every entry is an exact `==` pin, because ADR-0001 §12.5 makes this
# file a synthesis-key input -- a range would let the audio a cache key names
# change without the key changing.
#
# Two limits are recorded here rather than left for a reader to discover:
#
# 1. These are version pins, not artifact hashes, so `pip install
#    --require-hashes` cannot be used against this file yet. Adding the hashes
#    needs a network-connected resolve on the reference machine;
#    `docs/operations/WORKER-ENVIRONMENT.md` #Adding artifact hashes records
#    that as the remaining step and what it changes.
# 2. The set was derived from the qualified environment's `pip freeze` minus the
#    repository's pre-commit tooling, which shares that virtualenv and is not
#    loaded by the worker. The excluded distributions are named in that same
#    document so the derivation can be checked rather than trusted.
#
# `chatterbox-tts` resolves from the governed local source tree rather than from
# an index, per `docs/governance/RIGHTS-DATA-ARTIFACT-POLICY.md`: model code and
# weights never enter Git or CI, and the worker loads them from the operator's
# `data/models/` root. The commit it was installed from is recorded beside it.

